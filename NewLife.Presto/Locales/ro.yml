# Traducere în română. Cheile sunt textul sursă în engleză; traducerile lipsă revin la engleză la execuție.
"AccessToken is required when Auth=JWT.": "Autentificarea JWT necesită un AccessToken."
"Command timeout cannot be negative.": "Timeout-ul comenzii nu poate fi negativ."
"Command type {0} is not supported; use CommandType.Text.": "Tipul de comandă {0} nu este acceptat; utilizați CommandType.Text."
"Connection timeout must be greater than zero.": "Timeout-ul conexiunii trebuie să fie mai mare decât zero."
"Custom header '{0}' is managed by the driver and cannot be overridden.": "Antetul personalizat «{0}» este gestionat de driver și nu poate fi suprascris."
"Host cannot be empty.": "Gazda nu poate fi goală."
"Invalid custom header format: {0}. Expected name:value.": "Format nevalid pentru antetul personalizat: {0}. Se așteaptă name:value."
"Invalid session property format: {0}. Expected key=value.": "Format nevalid pentru proprietatea sesiunii: {0}. Se așteaptă key:value."
"Max retries cannot be negative.": "Numărul maxim de reîncercări nu poate fi negativ."
"Multiple statements are not supported.": "Mai multe instrucțiuni nu sunt acceptate."
"NewLife Presto Driver": "Driver NewLife Presto"
"Port must be between 1 and 65535.": "Portul trebuie să fie între 1 și 65535."
"Pure C# Presto/Trino ADO.NET driver with zero third-party dependencies, HTTP REST v1 protocol, full async/await and XCode ORM integration. MIT license. Supports net45~net11.": "Driver ADO.NET Presto/Trino în C# pur, fără dependențe terțe: protocol HTTP REST v1, async/await complet și integrare XCode ORM. Licență MIT. Acceptă net45~net11."
"Query failed: {0}": "Interogarea a eșuat: {0}"
"Retry interval cannot be negative.": "Intervalul de reîncercare nu poate fi negativ."
"Statement submission failed with HTTP {0}.": "Trimiterea instrucțiunii a eșuat: HTTP {0}."
"The driver does not support auto-increment columns; use a business key (Guid/snowflake) or set AllowInsertIdentity.": "Driverul nu acceptă coloane cu incrementare automată; utilizați o cheie de afaceri (Guid/fluturel de zăpadă) sau setați AllowInsertIdentity."
"The driver does not support transactions.": "Driverul nu acceptă tranzacții."
"Unsupported authentication mode: {0}.": "Mod de autentificare neacceptat: {0}."
"Unsupported protocol: {0}. Use Presto or Trino.": "Protocol neacceptat: {0}. Utilizați Presto sau Trino."

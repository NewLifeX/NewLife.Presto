"Max retries cannot be negative.": "Numărul maxim de reîncercări nu poate fi negativ."
"Multiple statements are not supported.": "Mai multe instrucțiuni nu sunt acceptate."
"NewLife Presto Driver": "Driver NewLife Presto"
"Port must be between 1 and 65535.": "Portul trebuie să fie între 1 și 65535."

# คำแปลภาษาไทย คีย์เป็นข้อความต้นฉบับภาษาอังกฤษ คำแปลที่ขาดจะกลับไปใช้อังกฤษเมื่อรัน
"AccessToken is required when Auth=JWT.": "การรับรองความถูกต้อง JWT ต้องใช้ AccessToken"
"Command timeout cannot be negative.": "การหมดเวลาของคำสั่งต้องไม่เป็นค่าลบ"
"Command type {0} is not supported; use CommandType.Text.": "ไม่รองรับประเภทคำสั่ง {0} ให้ใช้ CommandType.Text"
"Connection timeout must be greater than zero.": "การหมดเวลาการเชื่อมต่อต้องมากกว่าศูนย์"
"Custom header '{0}' is managed by the driver and cannot be overridden.": "ส่วนหัวที่กำหนดเอง '{0}' ได้รับการจัดการโดยไดรเวอร์และไม่สามารถเขียนทับได้"
"Host cannot be empty.": "โฮสต์ต้องไม่ว่างเปล่า"
"Invalid custom header format: {0}. Expected name:value.": "รูปแบบส่วนหัวที่กำหนดเองไม่ถูกต้อง: {0} ต้องเป็น name:value"
"Invalid session property format: {0}. Expected key=value.": "รูปแบบคุณสมบัติเซสชันไม่ถูกต้อง: {0} ต้องเป็น key=value"
"Max retries cannot be negative.": "จำนวนครั้งสูงสุดในการลองใหม่ต้องไม่เป็นค่าลบ"
"Multiple statements are not supported.": "ไม่รองรับหลายคำสั่ง"
"NewLife Presto Driver": "ไดรเวอร์ NewLife Presto"
"Port must be between 1 and 65535.": "พอร์ตต้องอยู่ระหว่าง 1 ถึง 65535"
"Pure C# Presto/Trino ADO.NET driver with zero third-party dependencies, HTTP REST v1 protocol, full async/await and XCode ORM integration. MIT license. Supports net45~net11.": "ไดรเวอร์ ADO.NET Presto/Trino แบบ C# บริสุทธิ์ที่ไม่มี dependency ของบุคคลที่สาม: โปรโตคอล HTTP REST v1, async/await ครบถ้วน และการรวม XCode ORM สัญญาอนุญาต MIT รองรับ net45~net11"
"Query failed: {0}": "คิวรีล้มเหลว: {0}"
"Retry interval cannot be negative.": "ช่วงเวลาลองใหม่ต้องไม่เป็นค่าลบ"
"Statement submission failed with HTTP {0}.": "ส่งคำสั่งไม่สำเร็จ: HTTP {0}"
"The driver does not support auto-increment columns; use a business key (Guid/snowflake) or set AllowInsertIdentity.": "ไดรเวอร์ไม่รองรับคอลัมน์ที่เพิ่มอัตโนมัติ ให้ใช้คีย์ธุรกิจ (Guid/สโนว์เฟลก) หรือตั้งค่า AllowInsertIdentity"
"The driver does not support transactions.": "ไดรเวอร์ไม่รองรับทรานแซกชัน"
"Unsupported authentication mode: {0}.": "โหมดการรับรองความถูกต้องที่ไม่รองรับ: {0}"
"Unsupported protocol: {0}. Use Presto or Trino.": "โปรโตคอลที่ไม่รองรับ: {0} ให้ใช้ Presto หรือ Trino"

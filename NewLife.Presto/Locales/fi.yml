# Suomenkielinen käännös. Avaimet ovat englanninkielinen lähdeteksti; puuttuvat käännökset palaavat englantiin suorituksen aikana.
"AccessToken is required when Auth=JWT.": "JWT-todennus vaatii AccessTokenin."
"Command timeout cannot be negative.": "Komennon aikakatkaisu ei voi olla negatiivinen."
"Command type {0} is not supported; use CommandType.Text.": "Komentotyyppi {0} ei ole tuettu; käytä CommandType.Text-arvoa."
"Connection timeout must be greater than zero.": "Yhteyden aikakatkaisun on oltava suurempi kuin nolla."
"Custom header '{0}' is managed by the driver and cannot be overridden.": "Mukautettua otsikkoa »{0}» hallinnoi ajuri, eikä sitä voi ohittaa."
"Host cannot be empty.": "Isäntä ei voi olla tyhjä."
"Invalid custom header format: {0}. Expected name:value.": "Mukautetun otsikon muoto on virheellinen: {0}. Odotettu muoto name:value."
"Invalid session property format: {0}. Expected key=value.": "Istunnon ominaisuuden muoto on virheellinen: {0}. Odotettu muoto key=value."
"Max retries cannot be negative.": "Uudelleenyritysten enimmäismäärä ei voi olla negatiivinen."
"Multiple statements are not supported.": "Useita lauseita ei tueta."
"NewLife Presto Driver": "NewLife Presto -ajuri"
"Port must be between 1 and 65535.": "Portin on oltava välillä 1–65535."
"Pure C# Presto/Trino ADO.NET driver with zero third-party dependencies, HTTP REST v1 protocol, full async/await and XCode ORM integration. MIT license. Supports net45~net11.": "Puhdas C#-ADO.NET-ajuri Presto/Trinolle ilman kolmannen osapuolen riippuvuuksia: HTTP REST v1, täysi async/await ja XCode ORM -integraatio. MIT-lisenssi. Tukee net45~net11."
"Query failed: {0}": "Kysely epäonnistui: {0}"
"Retry interval cannot be negative.": "Uudelleenyrityksen väli ei voi olla negatiivinen."
"Statement submission failed with HTTP {0}.": "Lauseen lähettäminen epäonnistui: HTTP {0}."
"The driver does not support auto-increment columns; use a business key (Guid/snowflake) or set AllowInsertIdentity.": "Ajuri ei tue automaattisesti kasvavia sarakkeita; käytä liiketoiminta-avainta (Guid/lumihiutale) tai aseta AllowInsertIdentity."
"The driver does not support transactions.": "Ajuri ei tue tapahtumia."
"Unsupported authentication mode: {0}.": "Todennustapa ei ole tuettu: {0}."
"Unsupported protocol: {0}. Use Presto or Trino.": "Protokolla ei ole tuettu: {0}. Käytä Prestoa tai Trinoa."

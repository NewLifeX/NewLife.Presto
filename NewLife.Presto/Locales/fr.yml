# Traduction française. Les clés sont le texte source anglais ; les traductions manquantes reviennent à l'anglais à l'exécution.
"AccessToken is required when Auth=JWT.": "Un AccessToken est requis pour l'authentification JWT."
"Command timeout cannot be negative.": "Le délai d'expiration de la commande ne peut pas être négatif."
"Command type {0} is not supported; use CommandType.Text.": "Le type de commande {0} n'est pas pris en charge ; utilisez CommandType.Text."
"Connection timeout must be greater than zero.": "Le délai de connexion doit être supérieur à zéro."
"Custom header '{0}' is managed by the driver and cannot be overridden.": "L'en-tête personnalisé « {0} » est géré par le pilote et ne peut pas être remplacé."
"Host cannot be empty.": "L'hôte ne peut pas être vide."
"Invalid custom header format: {0}. Expected name:value.": "Format d'en-tête personnalisé non valide : {0}. Format attendu name:value."
"Invalid session property format: {0}. Expected key=value.": "Format de propriété de session non valide : {0}. Format attendu key=value."
"Max retries cannot be negative.": "Le nombre maximal de tentatives ne peut pas être négatif."
"Multiple statements are not supported.": "Les instructions multiples ne sont pas prises en charge."
"NewLife Presto Driver": "Pilote NewLife Presto"
"Port must be between 1 and 65535.": "Le port doit être compris entre 1 et 65535."
"Pure C# Presto/Trino ADO.NET driver with zero third-party dependencies, HTTP REST v1 protocol, full async/await and XCode ORM integration. MIT license. Supports net45~net11.": "Pilote ADO.NET Presto/Trino en C# pur, sans dépendance tierce : protocole HTTP REST v1, async/await complet et intégration XCode ORM. Licence MIT. Prend en charge net45~net11."
"Query failed: {0}": "Échec de la requête : {0}"
"Retry interval cannot be negative.": "L'intervalle de nouvelle tentative ne peut pas être négatif."
"Statement submission failed with HTTP {0}.": "Échec de l'envoi de l'instruction : HTTP {0}."
"The driver does not support auto-increment columns; use a business key (Guid/snowflake) or set AllowInsertIdentity.": "Le pilote ne prend pas en charge les colonnes à incrémentation automatique ; utilisez une clé métier (Guid/flocon) ou définissez AllowInsertIdentity."
"The driver does not support transactions.": "Le pilote ne prend pas en charge les transactions."
"Unsupported authentication mode: {0}.": "Mode d'authentification non pris en charge : {0}."
"Unsupported protocol: {0}. Use Presto or Trino.": "Protocole non pris en charge : {0}. Utilisez Presto ou Trino."

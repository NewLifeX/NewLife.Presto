"Invalid session property format: {0}. Expected key=value.": "সেশন বৈশিষ্ট্যের বিন্যাস অবৈধ: {0}. প্রত্যাশিত key:value."
"Max retries cannot be negative.": "সর্বাধিক পুনঃপ্রচেষ্টা ঋণাত্মক হতে পারে না।"
"Multiple statements are not supported.": "একাধিক বিবৃতি সমর্থিত নয়।"
"NewLife Presto Driver": "NewLife Presto ড্রাইভার"
"Port must be between 1 and 65535.": "পোর্ট 1 থেকে 65535 এর মধ্যে হতে হবে।"
"Pure C# Presto/Trino ADO.NET driver with zero third-party dependencies, HTTP REST v1 protocol, full async/await and XCode ORM integration. MIT license. Supports net45~net11.": "কোনো তৃতীয় পক্ষের নির্ভরতা ছাড়া বিশুদ্ধ C# Presto/Trino ADO.NET ড্রাইভার: HTTP REST v1 প্রোটোকল, সম্পূর্ণ async/await এবং XCode ORM ইন্টিগ্রেশন। MIT লাইসেন্স। net45~net11 সমর্থিত।"

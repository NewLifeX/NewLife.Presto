"Connection timeout must be greater than zero.": "সংযোগ টাইমআউট শূন্যের বেশি হতে হবে।"
"Custom header '{0}' is managed by the driver and cannot be overridden.": "কাস্টম হেডার '{0}' ড্রাইভার দ্বারা পরিচালিত এবং ওভাররাইড করা যায় না।"

# 繁體中文譯文。鍵為英文源文，缺失時執行期回退英文。
"AccessToken is required when Auth=JWT.": "使用 JWT 驗證時必須提供 AccessToken。"
"Command timeout cannot be negative.": "命令逾時不能為負數。"
"Command type {0} is not supported; use CommandType.Text.": "不支援命令類型 {0}；請使用 CommandType.Text。"
"Connection timeout must be greater than zero.": "連線逾時必須大於零。"
"Custom header '{0}' is managed by the driver and cannot be overridden.": "自訂請求標頭「{0}」由驅動程式管理，不能覆寫。"
"Host cannot be empty.": "主機不能為空。"
"Invalid custom header format: {0}. Expected name:value.": "自訂請求標頭格式無效：{0}。應為 name:value。"
"Invalid session property format: {0}. Expected key=value.": "工作階段屬性格式無效：{0}。應為 key=value。"
"Max retries cannot be negative.": "最大重試次數不能為負數。"
"Multiple statements are not supported.": "不支援多條語句。"
"NewLife Presto Driver": "新生命 Presto 驅動程式"
"Port must be between 1 and 65535.": "連接埠必須在 1 到 65535 之間。"
"Pure C# Presto/Trino ADO.NET driver with zero third-party dependencies, HTTP REST v1 protocol, full async/await and XCode ORM integration. MIT license. Supports net45~net11.": "純 C# Presto/Trino ADO.NET 驅動程式，零第三方相依，HTTP REST v1 通訊協定，完整非同步/await 與 XCode ORM 整合。MIT 授權。支援 net45~net11。"
"Query failed: {0}": "查詢失敗：{0}"
"Retry interval cannot be negative.": "重試間隔不能為負數。"
"Statement submission failed with HTTP {0}.": "語句提交失敗，HTTP 狀態碼 {0}。"
"The driver does not support auto-increment columns; use a business key (Guid/snowflake) or set AllowInsertIdentity.": "驅動程式不支援自增欄位；請使用業務主鍵（Guid/雪花）或設定 AllowInsertIdentity。"
"The driver does not support transactions.": "驅動程式不支援交易。"
"Unsupported authentication mode: {0}.": "不支援的驗證模式：{0}。"
"Unsupported protocol: {0}. Use Presto or Trino.": "不支援的通訊協定：{0}。請使用 Presto 或 Trino。"

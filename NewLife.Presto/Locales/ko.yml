# 한국어 번역. 키는 영어 원문이며, 번역이 없으면 런타임에 영어로 대체됩니다.
"AccessToken is required when Auth=JWT.": "JWT 인증에는 AccessToken이 필요합니다."
"Command timeout cannot be negative.": "명령 시간 제한은 음수일 수 없습니다."
"Command type {0} is not supported; use CommandType.Text.": "명령 유형 {0}은(는) 지원되지 않습니다. CommandType.Text를 사용하세요."
"Connection timeout must be greater than zero.": "연결 시간 제한은 0보다 커야 합니다."
"Custom header '{0}' is managed by the driver and cannot be overridden.": "사용자 지정 헤더 '{0}'은(는) 드라이버가 관리하므로 재정의할 수 없습니다."
"Host cannot be empty.": "호스트는 비워 둘 수 없습니다."
"Invalid custom header format: {0}. Expected name:value.": "사용자 지정 헤더 형식이 잘못되었습니다: {0}. name:value 형식이어야 합니다."
"Invalid session property format: {0}. Expected key=value.": "세션 속성 형식이 잘못되었습니다: {0}. key=value 형식이어야 합니다."
"Max retries cannot be negative.": "최대 재시도 횟수는 음수일 수 없습니다."
"Multiple statements are not supported.": "여러 문은 지원되지 않습니다."
"NewLife Presto Driver": "NewLife Presto 드라이버"
"Port must be between 1 and 65535.": "포트는 1에서 65535 사이여야 합니다."
"Pure C# Presto/Trino ADO.NET driver with zero third-party dependencies, HTTP REST v1 protocol, full async/await and XCode ORM integration. MIT license. Supports net45~net11.": "타사 종속성이 없는 순수 C# Presto/Trino ADO.NET 드라이버입니다. HTTP REST v1, 완전한 비동기/await, XCode ORM 통합. MIT 라이선스. net45~net11 지원."
"Query failed: {0}": "쿼리 실패: {0}"
"Retry interval cannot be negative.": "재시도 간격은 음수일 수 없습니다."
"Statement submission failed with HTTP {0}.": "문 제출 실패: HTTP {0}."
"The driver does not support auto-increment columns; use a business key (Guid/snowflake) or set AllowInsertIdentity.": "드라이버는 자동 증가 열을 지원하지 않습니다. 비즈니스 키(Guid/스노우플레이크)를 사용하거나 AllowInsertIdentity를 설정하세요."
"The driver does not support transactions.": "드라이버는 트랜잭션을 지원하지 않습니다."
"Unsupported authentication mode: {0}.": "지원되지 않는 인증 모드: {0}."
"Unsupported protocol: {0}. Use Presto or Trino.": "지원되지 않는 프로토콜: {0}. Presto 또는 Trino를 사용하세요."

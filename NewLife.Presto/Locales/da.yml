# Dansk oversættelse. Nøglerne er den engelske kildetekst; manglende oversættelser falder tilbage til engelsk ved kørsel.
"AccessToken is required when Auth=JWT.": "JWT-godkendelse kræver en AccessToken."
"Command timeout cannot be negative.": "Kommandotimeout må ikke være negativ."
"Command type {0} is not supported; use CommandType.Text.": "Kommandotypen {0} understøttes ikke; brug CommandType.Text."
"Connection timeout must be greater than zero.": "Forbindelsens timeout skal være større end nul."
"Custom header '{0}' is managed by the driver and cannot be overridden.": "Den brugerdefinerede header »{0}« administreres af driveren og kan ikke tilsidesættes."
"Host cannot be empty.": "Værten må ikke være tom."
"Invalid custom header format: {0}. Expected name:value.": "Ugyldigt format for brugerdefineret header: {0}. Forventet name:value."
"Invalid session property format: {0}. Expected key=value.": "Ugyldigt format for sessionsegenskab: {0}. Forventet key=value."
"Max retries cannot be negative.": "Det maksimale antal forsøg må ikke være negativt."
"Multiple statements are not supported.": "Flere sætninger understøttes ikke."
"NewLife Presto Driver": "NewLife Presto-driver"
"Port must be between 1 and 65535.": "Porten skal være mellem 1 og 65535."
"Pure C# Presto/Trino ADO.NET driver with zero third-party dependencies, HTTP REST v1 protocol, full async/await and XCode ORM integration. MIT license. Supports net45~net11.": "Ren C#-ADO.NET-driver til Presto/Trino uden tredjepartsafhængigheder: HTTP REST v1, fuld async/await og XCode ORM-integration. MIT-licens. Understøtter net45~net11."
"Query failed: {0}": "Forespørgslen mislykkedes: {0}"
"Retry interval cannot be negative.": "Prøveintervallet må ikke være negativt."
"Statement submission failed with HTTP {0}.": "Sætningen kunne ikke sendes: HTTP {0}."
"The driver does not support auto-increment columns; use a business key (Guid/snowflake) or set AllowInsertIdentity.": "Driveren understøtter ikke automatisk stigende kolonner; brug en forretningsnøgle (Guid/snefnug) eller angiv AllowInsertIdentity."
"The driver does not support transactions.": "Driveren understøtter ikke transaktioner."
"Unsupported authentication mode: {0}.": "Godkendelsestilstanden understøttes ikke: {0}."
"Unsupported protocol: {0}. Use Presto or Trino.": "Protokollen understøttes ikke: {0}. Brug Presto eller Trino."
"Failed to parse the server response: {0}": "Kunne ikke parse serverens svar: {0}"
"The server returned an empty response.": "Serveren returnerede et tomt svar."
"Request to '{0}' failed with HTTP {1}.": "Anmodning til '{0}' mislykkedes med HTTP {1}."
"Schema collection name cannot be empty.": "Navnet på skemasamlingen må ikke være tomt."
"Schema collection '{0}' is not supported.": "Skemasamlingen '{0}' understøttes ikke."
"Catalog is required for the '{0}' schema collection.": "Der kræves et katalog til skemasamlingen '{0}'."
"Parameter '{0}' was not found.": "Parameteren '{0}' blev ikke fundet."
"Parameter name cannot be empty.": "Parameternavnet må ikke være tomt."
"Only input parameters are supported.": "Kun inputparametre understøttes."
"Special floating-point values (NaN and Infinity) are not supported as parameters.": "Særlige flydende kommaværdier (NaN og Infinity) understøttes ikke som parametre."
"The parameter value is outside the supported interval range.": "Parameterværdien er uden for det understøttede intervalområde."
"The connection must be a PrestoConnection.": "Forbindelsen skal være af typen PrestoConnection."
"The connection is not open.": "Forbindelsen er ikke åben."
"CommandText must not be empty.": "CommandText må ikke være tom."
"The connection string cannot be changed while the connection is open.": "Forbindelsesstrengen kan ikke ændres, mens forbindelsen er åben."
"The connection is already open.": "Forbindelsen er allerede åben."
"Database name cannot be empty.": "Databasenavnet må ikke være tomt."
"Column '{0}' was not found.": "Kolonnen '{0}' blev ikke fundet."
"The value is NULL.": "Værdien er NULL."
"Reader is closed.": "Læseren er lukket."
"Column index {0} is out of range.": "Kolonneindeks {0} er uden for intervallet."
"No current row is available.": "Der er ingen aktuel række tilgængelig."
"Cannot convert column '{0}' of type '{1}' to {2}. Value: {3}": "Kolonnen '{0}' af typen '{1}' kan ikke konverteres til {2}. Værdi: {3}"
"Connection timeout of {0} seconds expired.": "Forbindelsestimeout på {0} sekunder er udløbet."
"Command timeout of {0} seconds expired.": "Kommando-timeout på {0} sekunder er udløbet."
"Command behavior {0} is not supported.": "Kommandoadfærd {0} understøttes ikke."
"Parameter must be of type PrestoParameter.": "Parameteren skal være af typen PrestoParameter."
"TrustServerCertificate is enabled; server certificate validation is disabled.": "TrustServerCertificate er aktiveret; validering af servercertifikatet er deaktiveret."

# Ελληνική μετάφραση. Τα κλειδιά είναι το αγγλικό κείμενο προέλευσης· οι μεταφράσεις που λείπουν επιστρέφουν στα αγγλικά κατά την εκτέλεση.
"AccessToken is required when Auth=JWT.": "Η επαλήθευση ταυτότητας JWT απαιτεί AccessToken."
"Command timeout cannot be negative.": "Το χρονικό όριο εντολής δεν μπορεί να είναι αρνητικό."
"Command type {0} is not supported; use CommandType.Text.": "Ο τύπος εντολής {0} δεν υποστηρίζεται. Χρησιμοποιήστε CommandType.Text."
"Connection timeout must be greater than zero.": "Το χρονικό όριο σύνδεσης πρέπει να είναι μεγαλύτερο από μηδέν."
"Custom header '{0}' is managed by the driver and cannot be overridden.": "Η προσαρμοσμένη κεφαλίδα «{0}» διαχειρίζεται από το πρόγραμμα οδήγησης και δεν μπορεί να αντικατασταθεί."
"Host cannot be empty.": "Το κεντρικό σύστημα δεν μπορεί να είναι κενό."
"Invalid custom header format: {0}. Expected name:value.": "Μη έγκυρη μορφή προσαρμοσμένης κεφαλίδας: {0}. Αναμένεται name:value."
"Invalid session property format: {0}. Expected key=value.": "Μη έγκυρη μορφή ιδιότητας περιόδου λειτουργίας: {0}. Αναμένεται key=value."
"Max retries cannot be negative.": "Ο μέγιστος αριθμός επαναλήψεων δεν μπορεί να είναι αρνητικός."
"Multiple statements are not supported.": "Οι πολλαπλές εντολές δεν υποστηρίζονται."
"NewLife Presto Driver": "Πρόγραμμα οδήγησης NewLife Presto"
"Port must be between 1 and 65535.": "Η θύρα πρέπει να είναι μεταξύ 1 και 65535."
"Pure C# Presto/Trino ADO.NET driver with zero third-party dependencies, HTTP REST v1 protocol, full async/await and XCode ORM integration. MIT license. Supports net45~net11.": "Καθαρό πρόγραμμα οδήγησης ADO.NET Presto/Trino σε C# χωρίς εξαρτήσεις τρίτων: πρωτόκολλο HTTP REST v1, πλήρες async/await και ενσωμάτωση XCode ORM. Άδεια MIT. Υποστηρίζει net45~net11."
"Query failed: {0}": "Η επερώτηση απέτυχε: {0}"
"Retry interval cannot be negative.": "Το διάστημα επανάληψης δεν μπορεί να είναι αρνητικό."
"Statement submission failed with HTTP {0}.": "Η αποστολή της εντολής απέτυχε: HTTP {0}."
"The driver does not support auto-increment columns; use a business key (Guid/snowflake) or set AllowInsertIdentity.": "Το πρόγραμμα οδήγησης δεν υποστηρίζει στήλες αυτόματης αύξησης. Χρησιμοποιήστε επιχειρηματικό κλειδί (Guid/νιφάδα χιονιού) ή ορίστε AllowInsertIdentity."
"The driver does not support transactions.": "Το πρόγραμμα οδήγησης δεν υποστηρίζει συναλλαγές."
"Unsupported authentication mode: {0}.": "Μη υποστηριζόμενη λειτουργία επαλήθευσης ταυτότητας: {0}."
"Unsupported protocol: {0}. Use Presto or Trino.": "Μη υποστηριζόμενο πρωτόκολλο: {0}. Χρησιμοποιήστε Presto ή Trino."

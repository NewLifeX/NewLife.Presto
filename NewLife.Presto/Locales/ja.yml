# 日本語訳。キーは英語原文で、未翻訳時は実行時に英語へフォールバックします。
"AccessToken is required when Auth=JWT.": "JWT 認証では AccessToken が必要です。"
"Command timeout cannot be negative.": "コマンド タイムアウトに負の値は指定できません。"
"Command type {0} is not supported; use CommandType.Text.": "コマンドの種類 {0} はサポートされていません。CommandType.Text を使用してください。"
"Connection timeout must be greater than zero.": "接続タイムアウトは 0 より大きい必要があります。"
"Custom header '{0}' is managed by the driver and cannot be overridden.": "カスタム ヘッダー '{0}' はドライバーが管理しているため上書きできません。"
"Host cannot be empty.": "ホストを空にすることはできません。"
"Invalid custom header format: {0}. Expected name:value.": "カスタム ヘッダーの形式が無効です: {0}。name:value の形式で指定してください。"
"Invalid session property format: {0}. Expected key=value.": "セッション プロパティの形式が無効です: {0}。key=value の形式で指定してください。"
"Max retries cannot be negative.": "最大再試行回数に負の値は指定できません。"
"Multiple statements are not supported.": "複数のステートメントはサポートされていません。"
"NewLife Presto Driver": "NewLife Presto ドライバー"
"Port must be between 1 and 65535.": "ポートは 1 から 65535 の範囲で指定してください。"
"Pure C# Presto/Trino ADO.NET driver with zero third-party dependencies, HTTP REST v1 protocol, full async/await and XCode ORM integration. MIT license. Supports net45~net11.": "サードパーティ依存のない純 C# の Presto/Trino ADO.NET ドライバー。HTTP REST v1、完全な非同期/await、XCode ORM 統合。MIT ライセンス。net45~net11 対応。"
"Query failed: {0}": "クエリが失敗しました: {0}"
"Retry interval cannot be negative.": "再試行間隔に負の値は指定できません。"
"Statement submission failed with HTTP {0}.": "ステートメントの送信に失敗しました。HTTP {0}。"
"The driver does not support auto-increment columns; use a business key (Guid/snowflake) or set AllowInsertIdentity.": "ドライバーは自動増分列をサポートしていません。ビジネス キー (Guid/スノーフレーク) を使用するか、AllowInsertIdentity を設定してください。"
"The driver does not support transactions.": "ドライバーはトランザクションをサポートしていません。"
"Unsupported authentication mode: {0}.": "サポートされていない認証モード: {0}。"
"Unsupported protocol: {0}. Use Presto or Trino.": "サポートされていないプロトコル: {0}。Presto または Trino を使用してください。"
"Failed to parse the server response: {0}": "サーバー応答を解析できませんでした: {0}"
"The server returned an empty response.": "サーバーは空の応答を返しました。"
"Request to '{0}' failed with HTTP {1}.": "'{0}' への要求は HTTP {1} で失敗しました。"
"Schema collection name cannot be empty.": "スキーマ コレクション名を空にすることはできません。"
"Schema collection '{0}' is not supported.": "スキーマ コレクション '{0}' はサポートされていません。"
"Catalog is required for the '{0}' schema collection.": "スキーマ コレクション '{0}' にはカタログが必要です。"
"Parameter '{0}' was not found.": "パラメーター '{0}' が見つかりませんでした。"
"Parameter name cannot be empty.": "パラメーター名を空にすることはできません。"
"Only input parameters are supported.": "サポートされるのは入力パラメーターのみです。"
"Special floating-point values (NaN and Infinity) are not supported as parameters.": "特殊な浮動小数点値 (NaN と Infinity) はパラメーターとしてサポートされていません。"
"The parameter value is outside the supported interval range.": "パラメーター値がサポートされている interval 範囲外です。"
"The connection must be a PrestoConnection.": "接続は PrestoConnection 型である必要があります。"
"The connection is not open.": "接続が開かれていません。"
"CommandText must not be empty.": "CommandText を空にすることはできません。"
"The connection string cannot be changed while the connection is open.": "接続が開いている間は接続文字列を変更できません。"
"The connection is already open.": "接続はすでに開かれています。"
"Database name cannot be empty.": "データベース名を空にすることはできません。"
"Column '{0}' was not found.": "列 '{0}' が見つかりませんでした。"
"The value is NULL.": "値は NULL です。"
"Reader is closed.": "リーダーは閉じられています。"
"Column index {0} is out of range.": "列インデックス {0} は範囲外です。"
"No current row is available.": "現在の行がありません。"
"Cannot convert column '{0}' of type '{1}' to {2}. Value: {3}": "列 '{0}' (型 '{1}') を {2} に変換できません。値: {3}"
"Connection timeout of {0} seconds expired.": "{0} 秒の接続タイムアウトが発生しました。"
"Command timeout of {0} seconds expired.": "{0} 秒のコマンド タイムアウトが発生しました。"
"Command behavior {0} is not supported.": "コマンド動作 {0} はサポートされていません。"
"Parameter must be of type PrestoParameter.": "パラメーターは PrestoParameter 型である必要があります。"
"TrustServerCertificate is enabled; server certificate validation is disabled.": "TrustServerCertificate が有効になっているため、サーバー証明書の検証が無効になっています。"
"The batch contains no commands.": "バッチにコマンドが含まれていません。"
"OAuth2 authentication requires a token endpoint.": "OAuth2 認証にはトークンエンドポイントが必要です。"
"OAuth2 authentication requires a client id.": "OAuth2 認証にはクライアント ID が必要です。"
"OAuth2 authentication is not initialized.": "OAuth2 認証が初期化されていません。"
"Failed to acquire an OAuth2 access token: HTTP {0}.": "OAuth2 アクセストークンの取得に失敗しました: HTTP {0}。"
"The OAuth2 token endpoint returned an empty response.": "OAuth2 トークンエンドポイントが空の応答を返しました。"
"The OAuth2 token endpoint returned no access token.": "OAuth2 トークンエンドポイントがアクセストークンを返しませんでした。"
"Query id cannot be empty.": "クエリ ID を空にすることはできません。"
"Unsupported complex type mode: {0}. Use String or Structured.": "複合型モードはサポートされていません: {0}。String または Structured を使用してください。"

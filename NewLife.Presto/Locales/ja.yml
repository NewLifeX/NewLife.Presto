# 日本語訳。キーは英語原文で、未翻訳時は実行時に英語へフォールバックします。
"AccessToken is required when Auth=JWT.": "JWT 認証では AccessToken が必要です。"
"Command timeout cannot be negative.": "コマンド タイムアウトに負の値は指定できません。"
"Command type {0} is not supported; use CommandType.Text.": "コマンドの種類 {0} はサポートされていません。CommandType.Text を使用してください。"
"Connection timeout must be greater than zero.": "接続タイムアウトは 0 より大きい必要があります。"
"Custom header '{0}' is managed by the driver and cannot be overridden.": "カスタム ヘッダー '{0}' はドライバーが管理しているため上書きできません。"
"Host cannot be empty.": "ホストを空にすることはできません。"
"Invalid custom header format: {0}. Expected name:value.": "カスタム ヘッダーの形式が無効です: {0}。name:value の形式で指定してください。"
"Invalid session property format: {0}. Expected key=value.": "セッション プロパティの形式が無効です: {0}。key=value の形式で指定してください。"
"Max retries cannot be negative.": "最大再試行回数に負の値は指定できません。"
"Multiple statements are not supported.": "複数のステートメントはサポートされていません。"
"NewLife Presto Driver": "NewLife Presto ドライバー"
"Port must be between 1 and 65535.": "ポートは 1 から 65535 の範囲で指定してください。"
"Pure C# Presto/Trino ADO.NET driver with zero third-party dependencies, HTTP REST v1 protocol, full async/await and XCode ORM integration. MIT license. Supports net45~net11.": "サードパーティ依存のない純 C# の Presto/Trino ADO.NET ドライバー。HTTP REST v1、完全な非同期/await、XCode ORM 統合。MIT ライセンス。net45~net11 対応。"
"Query failed: {0}": "クエリが失敗しました: {0}"
"Retry interval cannot be negative.": "再試行間隔に負の値は指定できません。"
"Statement submission failed with HTTP {0}.": "ステートメントの送信に失敗しました。HTTP {0}。"
"The driver does not support auto-increment columns; use a business key (Guid/snowflake) or set AllowInsertIdentity.": "ドライバーは自動増分列をサポートしていません。ビジネス キー (Guid/スノーフレーク) を使用するか、AllowInsertIdentity を設定してください。"
"The driver does not support transactions.": "ドライバーはトランザクションをサポートしていません。"
"Unsupported authentication mode: {0}.": "サポートされていない認証モード: {0}。"
"Unsupported protocol: {0}. Use Presto or Trino.": "サポートされていないプロトコル: {0}。Presto または Trino を使用してください。"

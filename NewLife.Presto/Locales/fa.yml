# ترجمهٔ فارسی. کلیدها متن مبدأ انگلیسی هستند؛ ترجمه‌های غایب در زمان اجرا به انگلیسی برمی‌گردند.
"AccessToken is required when Auth=JWT.": "احراز هویت JWT به AccessToken نیاز دارد."
"Command timeout cannot be negative.": "مهلت فرمان نمی‌تواند منفی باشد."
"Command type {0} is not supported; use CommandType.Text.": "نوع فرمان {0} پشتیبانی نمی‌شود؛ از CommandType.Text استفاده کنید."
"Connection timeout must be greater than zero.": "مهلت اتصال باید بزرگ‌تر از صفر باشد."
"Custom header '{0}' is managed by the driver and cannot be overridden.": "سربرگ سفارشی '{0}' توسط درایور مدیریت می‌شود و قابل بازنویسی نیست."
"Host cannot be empty.": "میزبان نمی‌تواند خالی باشد."
"Invalid custom header format: {0}. Expected name:value.": "قالب سربرگ سفارشی نامعتبر است: {0}. قالب مورد انتظار name:value."
"Invalid session property format: {0}. Expected key=value.": "قالب ویژگی نشست نامعتبر است: {0}. قالب مورد انتظار key:value."
"Max retries cannot be negative.": "حداکثر تعداد تلاش مجدد نمی‌تواند منفی باشد."
"Multiple statements are not supported.": "چند دستور پشتیبانی نمی‌شود."
"NewLife Presto Driver": "درایور NewLife Presto"
"Port must be between 1 and 65535.": "پورت باید بین 1 و 65535 باشد."
"Pure C# Presto/Trino ADO.NET driver with zero third-party dependencies, HTTP REST v1 protocol, full async/await and XCode ORM integration. MIT license. Supports net45~net11.": "درایور خالص C# ADO.NET برای Presto/Trino بدون وابستگی شخص ثالث: پروتکل HTTP REST v1، async/await کامل و یکپارچگی XCode ORM. مجوز MIT. از net45~net11 پشتیبانی می‌کند."
"Query failed: {0}": "پرس‌وجو ناموفق بود: {0}"
"Retry interval cannot be negative.": "فاصله تلاش مجدد نمی‌تواند منفی باشد."
"Statement submission failed with HTTP {0}.": "ارسال دستور ناموفق بود: HTTP {0}."
"The driver does not support auto-increment columns; use a business key (Guid/snowflake) or set AllowInsertIdentity.": "درایور ستون‌های افزایش خودکار را پشتیبانی نمی‌کند؛ از کلید کسب‌وکار (Guid/دانه برف) استفاده کنید یا AllowInsertIdentity را تنظیم کنید."
"The driver does not support transactions.": "درایور تراکنش‌ها را پشتیبانی نمی‌کند."
"Unsupported authentication mode: {0}.": "حالت احراز هویت پشتیبانی نمی‌شود: {0}."
"Unsupported protocol: {0}. Use Presto or Trino.": "پروتکل پشتیبانی نمی‌شود: {0}. از Presto یا Trino استفاده کنید."

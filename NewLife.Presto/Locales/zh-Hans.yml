"Connection timeout must be greater than zero.": "连接超时必须大于零。"
"Custom header '{0}' is managed by the driver and cannot be overridden.": "自定义请求头«{0}»由驱动管理，不能覆盖。"
"Host cannot be empty.": "主机不能为空。"
"Invalid custom header format: {0}. Expected name:value.": "自定义请求头格式无效：{0}。应为 name:value。"
"Invalid session property format: {0}. Expected key=value.": "会话属性格式无效：{0}。应为 key=value。"
"Max retries cannot be negative.": "最大重试次数不能为负数。"
"Multiple statements are not supported.": "不支持多条语句。"
"NewLife Presto Driver": "新生命 Presto 驱动"
"Port must be between 1 and 65535.": "端口必须在 1 到 65535 之间。"
"Pure C# Presto/Trino ADO.NET driver with zero third-party dependencies, HTTP REST v1 protocol, full async/await and XCode ORM integration. MIT license. Supports net45~net11.": "纯 C# Presto/Trino ADO.NET 驱动，零第三方依赖，HTTP REST v1 协议，完整异步/await 与 XCode ORM 集成。MIT 协议。支持 net45~net11。"
"Query failed: {0}": "查询失败：{0}"
"Retry interval cannot be negative.": "重试间隔不能为负数。"
"Statement submission failed with HTTP {0}.": "语句提交失败，HTTP 状态码 {0}。"
"The driver does not support auto-increment columns; use a business key (Guid/snowflake) or set AllowInsertIdentity.": "驱动不支持自增列；请使用业务主键（Guid/雪花）或设置 AllowInsertIdentity。"
"The driver does not support transactions.": "驱动不支持事务。"
"Unsupported authentication mode: {0}.": "不支持的认证模式：{0}。"

# Traduzione italiana. Le chiavi sono il testo sorgente inglese; le traduzioni mancanti tornano all'inglese a runtime.
"AccessToken is required when Auth=JWT.": "Per l'autenticazione JWT è necessario un AccessToken."
"Command timeout cannot be negative.": "Il timeout del comando non può essere negativo."
"Command type {0} is not supported; use CommandType.Text.": "Il tipo di comando {0} non è supportato; usare CommandType.Text."
"Connection timeout must be greater than zero.": "Il timeout di connessione deve essere maggiore di zero."
"Custom header '{0}' is managed by the driver and cannot be overridden.": "L'intestazione personalizzata «{0}» è gestita dal driver e non può essere sostituita."
"Host cannot be empty.": "L'host non può essere vuoto."
"Invalid custom header format: {0}. Expected name:value.": "Formato dell'intestazione personalizzata non valido: {0}. Atteso name:value."
"Invalid session property format: {0}. Expected key=value.": "Formato della proprietà di sessione non valido: {0}. Atteso key=value."
"Max retries cannot be negative.": "Il numero massimo di tentativi non può essere negativo."
"Multiple statements are not supported.": "Le istruzioni multiple non sono supportate."
"NewLife Presto Driver": "Driver NewLife Presto"
"Port must be between 1 and 65535.": "La porta deve essere compresa tra 1 e 65535."

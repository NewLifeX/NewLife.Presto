"Query failed: {0}": "Query non riuscita: {0}"
"Retry interval cannot be negative.": "L'intervallo di ripetizione non può essere negativo."
"Statement submission failed with HTTP {0}.": "Invio dell'istruzione non riuscito: HTTP {0}."
"The driver does not support auto-increment columns; use a business key (Guid/snowflake) or set AllowInsertIdentity.": "Il driver non supporta colonne a incremento automatico; usare una chiave di business (Guid/fiocco di neve) o impostare AllowInsertIdentity."
"The driver does not support transactions.": "Il driver non supporta le transazioni."
"Unsupported authentication mode: {0}.": "Modalità di autenticazione non supportata: {0}."
"Unsupported protocol: {0}. Use Presto or Trino.": "Protocollo non supportato: {0}. Usare Presto o Trino."

# Norsk bokmål-oversettelse. Nøklene er den engelske kildeteksten; manglende oversettelser faller tilbake til engelsk ved kjøring.
"AccessToken is required when Auth=JWT.": "JWT-autentisering krever en AccessToken."
"Command timeout cannot be negative.": "Tidsavbruddet for kommandoen kan ikke være negativt."
"Command type {0} is not supported; use CommandType.Text.": "Kommandotypen {0} støttes ikke; bruk CommandType.Text."
"Connection timeout must be greater than zero.": "Tidsavbruddet for tilkoblingen må være større enn null."
"Custom header '{0}' is managed by the driver and cannot be overridden.": "Den egendefinerte overskriften «{0}» administreres av driveren og kan ikke overstyres."
"Host cannot be empty.": "Verten kan ikke være tom."
"Invalid custom header format: {0}. Expected name:value.": "Ugyldig format for egendefinert overskrift: {0}. Forventet name:value."
"Invalid session property format: {0}. Expected key=value.": "Ugyldig format for øktsegenskap: {0}. Forventet key:value."
"Max retries cannot be negative.": "Maksimalt antall forsøk kan ikke være negativt."
"Multiple statements are not supported.": "Flere setninger støttes ikke."
"NewLife Presto Driver": "NewLife Presto-driver"
"Port must be between 1 and 65535.": "Porten må være mellom 1 og 65535."
"Pure C# Presto/Trino ADO.NET driver with zero third-party dependencies, HTTP REST v1 protocol, full async/await and XCode ORM integration. MIT license. Supports net45~net11.": "Ren C#-ADO.NET-driver for Presto/Trino uten tredjepartsavhengigheter: HTTP REST v1, full async/await og XCode ORM-integrasjon. MIT-lisens. Støtter net45~net11."
"Query failed: {0}": "Spørringen mislyktes: {0}"
"Retry interval cannot be negative.": "Prøveintervallet kan ikke være negativt."
"Statement submission failed with HTTP {0}.": "Kunne ikke sende setningen: HTTP {0}."
"The driver does not support auto-increment columns; use a business key (Guid/snowflake) or set AllowInsertIdentity.": "Driveren støtter ikke automatisk økende kolonner; bruk en forretningsnøkkel (Guid/snøfnugg) eller angi AllowInsertIdentity."
"The driver does not support transactions.": "Driveren støtter ikke transaksjoner."
"Unsupported authentication mode: {0}.": "Autentiseringsmodusen støttes ikke: {0}."
"Unsupported protocol: {0}. Use Presto or Trino.": "Protokollen støttes ikke: {0}. Bruk Presto eller Trino."
"Failed to parse the server response: {0}": "Kunne ikke analysere serverens svar: {0}"
"The server returned an empty response.": "Serveren returnerte et tomt svar."
"Request to '{0}' failed with HTTP {1}.": "Forespørselen til '{0}' mislyktes med HTTP {1}."
"Schema collection name cannot be empty.": "Navnet på skjemasamlingen kan ikke være tomt."
"Schema collection '{0}' is not supported.": "Skjemasamlingen '{0}' støttes ikke."
"Catalog is required for the '{0}' schema collection.": "En katalog kreves for skjemasamlingen '{0}'."
"Parameter '{0}' was not found.": "Parameteren '{0}' ble ikke funnet."
"Parameter name cannot be empty.": "Parameternavnet kan ikke være tomt."
"Only input parameters are supported.": "Bare inndataparametere støttes."
"Special floating-point values (NaN and Infinity) are not supported as parameters.": "Spesielle flyttallverdier (NaN og Infinity) støttes ikke som parametere."
"The parameter value is outside the supported interval range.": "Parameterverdien er utenfor det støttede intervallområdet."
"The connection must be a PrestoConnection.": "Tilkoblingen må være av typen PrestoConnection."
"The connection is not open.": "Tilkoblingen er ikke åpen."
"CommandText must not be empty.": "CommandText kan ikke være tom."
"The connection string cannot be changed while the connection is open.": "Tilkoblingsstrengen kan ikke endres mens tilkoblingen er åpen."
"The connection is already open.": "Tilkoblingen er allerede åpen."
"Database name cannot be empty.": "Databasenavnet kan ikke være tomt."
"Column '{0}' was not found.": "Kolonnen '{0}' ble ikke funnet."
"The value is NULL.": "Verdien er NULL."
"Reader is closed.": "Leseren er lukket."
"Column index {0} is out of range.": "Kolonneindeksen {0} er utenfor området."
"No current row is available.": "Ingen gjeldende rad er tilgjengelig."
"Cannot convert column '{0}' of type '{1}' to {2}. Value: {3}": "Kan ikke konvertere kolonnen '{0}' av typen '{1}' til {2}. Verdi: {3}"
"Connection timeout of {0} seconds expired.": "Tilkoblingstidsavbruddet på {0} sekunder er utløpt."
"Command timeout of {0} seconds expired.": "Kommandotidsavbruddet på {0} sekunder er utløpt."
"Command behavior {0} is not supported.": "Kommandoatferden {0} støttes ikke."
"Parameter must be of type PrestoParameter.": "Parameteren må være av typen PrestoParameter."
"TrustServerCertificate is enabled; server certificate validation is disabled.": "TrustServerCertificate er aktivert; validering av servercertifikatet er deaktivert."
"The batch contains no commands.": "The batch contains no commands."

# ترجمة عربية. المفاتيح هي النص المصدر بالإنجليزية، والترجمات المفقودة تعود إلى الإنجليزية وقت التشغيل.
"AccessToken is required when Auth=JWT.": "تتطلب مصادقة JWT وجود AccessToken."
"Command timeout cannot be negative.": "لا يمكن أن تكون مهلة الأمر سالبة."
"Command type {0} is not supported; use CommandType.Text.": "نوع الأمر {0} غير مدعوم؛ استخدم CommandType.Text."
"Connection timeout must be greater than zero.": "يجب أن تكون مهلة الاتصال أكبر من الصفر."
"Custom header '{0}' is managed by the driver and cannot be overridden.": "تتم إدارة الرأس المخصص '{0}' بواسطة برنامج التشغيل ولا يمكن تجاوزه."
"Host cannot be empty.": "لا يمكن أن يكون المضيف فارغًا."
"Invalid custom header format: {0}. Expected name:value.": "تنسيق الرأس المخصص غير صالح: {0}. التنسيق المتوقع name:value."
"Invalid session property format: {0}. Expected key=value.": "تنسيق خاصية الجلسة غير صالح: {0}. التنسيق المتوقع key:value."
"Max retries cannot be negative.": "لا يمكن أن يكون الحد الأقصى لعدد المحاولات سالبًا."
"Multiple statements are not supported.": "لا يتم دعم عبارات متعددة."
"NewLife Presto Driver": "برنامج تشغيل NewLife Presto"
"Port must be between 1 and 65535.": "يجب أن يكون المنفذ بين 1 و65535."
"Pure C# Presto/Trino ADO.NET driver with zero third-party dependencies, HTTP REST v1 protocol, full async/await and XCode ORM integration. MIT license. Supports net45~net11.": "برنامج تشغيل ADO.NET نقي بلغة C# لـ Presto/Trino بدون تبعيات خارجية: بروتوكول HTTP REST v1، ودعم async/await كامل وتكامل XCode ORM. ترخيص MIT. يدعم net45~net11."
"Query failed: {0}": "فشل الاستعلام: {0}"
"Retry interval cannot be negative.": "لا يمكن أن تكون فترة إعادة المحاولة سالبة."
"Statement submission failed with HTTP {0}.": "فشل إرسال العبارة: HTTP {0}."
"The driver does not support auto-increment columns; use a business key (Guid/snowflake) or set AllowInsertIdentity.": "لا يدعم برنامج التشغيل الأعمدة ذاتية الزيادة؛ استخدم مفتاح أعمال (Guid/ندفة ثلج) أو عيّن AllowInsertIdentity."
"The driver does not support transactions.": "لا يدعم برنامج التشغيل المعاملات."
"Unsupported authentication mode: {0}.": "وضع مصادقة غير مدعوم: {0}."
"Unsupported protocol: {0}. Use Presto or Trino.": "بروتوكول غير مدعوم: {0}. استخدم Presto أو Trino."

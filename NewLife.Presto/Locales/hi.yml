# हिन्दी अनुवाद। कुंजियाँ अंग्रेज़ी स्रोत पाठ हैं; अनुपलब्ध अनुवाद रनटाइम पर अंग्रेज़ी पर लौटते हैं।
"AccessToken is required when Auth=JWT.": "JWT प्रमाणीकरण के लिए AccessToken आवश्यक है।"
"Command timeout cannot be negative.": "कमांड टाइमआउट ऋणात्मक नहीं हो सकता।"
"Command type {0} is not supported; use CommandType.Text.": "कमांड प्रकार {0} समर्थित नहीं है; CommandType.Text का उपयोग करें।"
"Connection timeout must be greater than zero.": "कनेक्शन टाइमआउट शून्य से अधिक होना चाहिए।"
"Custom header '{0}' is managed by the driver and cannot be overridden.": "कस्टम हेडर '{0}' ड्राइवर द्वारा प्रबंधित है और इसे ओवरराइड नहीं किया जा सकता।"
"Host cannot be empty.": "होस्ट खाली नहीं हो सकता।"
"Invalid custom header format: {0}. Expected name:value.": "कस्टम हेडर का प्रारूप अमान्य है: {0}. अपेक्षित name:value."
"Invalid session property format: {0}. Expected key=value.": "सत्र गुण का प्रारूप अमान्य है: {0}. अपेक्षित key=value."
"Max retries cannot be negative.": "अधिकतम पुनःप्रयास ऋणात्मक नहीं हो सकते।"
"Multiple statements are not supported.": "एकाधिक कथन समर्थित नहीं हैं।"
"NewLife Presto Driver": "NewLife Presto ड्राइवर"
"Port must be between 1 and 65535.": "पोर्ट 1 और 65535 के बीच होना चाहिए।"
"Pure C# Presto/Trino ADO.NET driver with zero third-party dependencies, HTTP REST v1 protocol, full async/await and XCode ORM integration. MIT license. Supports net45~net11.": "शून्य तृतीय-पक्ष निर्भरता वाला शुद्ध C# Presto/Trino ADO.NET ड्राइवर: HTTP REST v1 प्रोटोकॉल, पूर्ण async/await और XCode ORM एकीकरण। MIT लाइसेंस। net45~net11 समर्थित।"
"Query failed: {0}": "क्वेरी विफल: {0}"
"Retry interval cannot be negative.": "पुनःप्रयास अंतराल ऋणात्मक नहीं हो सकता।"
"Statement submission failed with HTTP {0}.": "कथन भेजने में विफल: HTTP {0}."
"The driver does not support auto-increment columns; use a business key (Guid/snowflake) or set AllowInsertIdentity.": "ड्राइवर स्वतः बढ़ने वाले कॉलम समर्थित नहीं करता; व्यवसाय कुंजी (Guid/स्नोफ्लेक) का उपयोग करें या AllowInsertIdentity सेट करें।"
"The driver does not support transactions.": "ड्राइवर लेनदेन समर्थित नहीं करता।"
"Unsupported authentication mode: {0}.": "असमर्थित प्रमाणीकरण मोड: {0}."
"Unsupported protocol: {0}. Use Presto or Trino.": "असमर्थित प्रोटोकॉल: {0}. Presto या Trino का उपयोग करें।"

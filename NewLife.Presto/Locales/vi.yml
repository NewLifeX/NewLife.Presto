# Bản dịch tiếng Việt. Khóa là văn bản nguồn tiếng Anh; bản dịch thiếu sẽ quay về tiếng Anh khi chạy.
"AccessToken is required when Auth=JWT.": "Xác thực JWT yêu cầu AccessToken."
"Command timeout cannot be negative.": "Thời gian chờ lệnh không được âm."
"Command type {0} is not supported; use CommandType.Text.": "Loại lệnh {0} không được hỗ trợ; hãy dùng CommandType.Text."
"Connection timeout must be greater than zero.": "Thời gian chờ kết nối phải lớn hơn không."
"Custom header '{0}' is managed by the driver and cannot be overridden.": "Tiêu đề tùy chỉnh '{0}' do trình điều khiển quản lý và không thể ghi đè."
"Host cannot be empty.": "Máy chủ không được để trống."
"Invalid custom header format: {0}. Expected name:value.": "Định dạng tiêu đề tùy chỉnh không hợp lệ: {0}. Mong đợi name:value."
"Invalid session property format: {0}. Expected key=value.": "Định dạng thuộc tính phiên không hợp lệ: {0}. Mong đợi key=value."
"Max retries cannot be negative.": "Số lần thử lại tối đa không được âm."
"Multiple statements are not supported.": "Nhiều câu lệnh không được hỗ trợ."
"NewLife Presto Driver": "Trình điều khiển NewLife Presto"
"Port must be between 1 and 65535.": "Cổng phải nằm trong khoảng 1 đến 65535."
"Pure C# Presto/Trino ADO.NET driver with zero third-party dependencies, HTTP REST v1 protocol, full async/await and XCode ORM integration. MIT license. Supports net45~net11.": "Trình điều khiển ADO.NET Presto/Trino thuần C# không có phụ thuộc bên thứ ba: giao thức HTTP REST v1, async/await đầy đủ và tích hợp XCode ORM. Giấy phép MIT. Hỗ trợ net45~net11."
"Query failed: {0}": "Truy vấn thất bại: {0}"
"Retry interval cannot be negative.": "Khoảng thời gian thử lại không được âm."
"Statement submission failed with HTTP {0}.": "Gửi câu lệnh thất bại: HTTP {0}."
"The driver does not support auto-increment columns; use a business key (Guid/snowflake) or set AllowInsertIdentity.": "Trình điều khiển không hỗ trợ cột tự tăng; hãy dùng khóa nghiệp vụ (Guid/bông tuyết) hoặc đặt AllowInsertIdentity."
"The driver does not support transactions.": "Trình điều khiển không hỗ trợ giao dịch."
"Unsupported authentication mode: {0}.": "Chế độ xác thực không được hỗ trợ: {0}."
"Unsupported protocol: {0}. Use Presto or Trino.": "Giao thức không được hỗ trợ: {0}. Hãy dùng Presto hoặc Trino."
"Failed to parse the server response: {0}": "Không thể phân tích phản hồi của máy chủ: {0}"

"No current row is available.": "Không có hàng hiện tại nào."
"Cannot convert column '{0}' of type '{1}' to {2}. Value: {3}": "Không thể chuyển đổi cột '{0}' kiểu '{1}' sang {2}. Giá trị: {3}"
"Connection timeout of {0} seconds expired.": "Đã hết thời gian chờ kết nối {0} giây."

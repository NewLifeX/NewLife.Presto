# Český překlad. Klíče jsou anglický zdrojový text; chybějící překlady se za běhu vracejí k angličtině.
"AccessToken is required when Auth=JWT.": "Ověřování JWT vyžaduje AccessToken."
"Command timeout cannot be negative.": "Časový limit příkazu nesmí být záporný."
"Command type {0} is not supported; use CommandType.Text.": "Typ příkazu {0} není podporován; použijte CommandType.Text."
"Connection timeout must be greater than zero.": "Časový limit připojení musí být větší než nula."
"Custom header '{0}' is managed by the driver and cannot be overridden.": "Vlastní hlavička «{0}« je spravována ovladačem a nelze ji přepsat."
"Host cannot be empty.": "Hostitel nesmí být prázdný."
"Invalid custom header format: {0}. Expected name:value.": "Neplatný formát vlastní hlavičky: {0}. Očekává se name:value."
"Invalid session property format: {0}. Expected key=value.": "Neplatný formát vlastnosti relace: {0}. Očekává se key:value."
"Max retries cannot be negative.": "Maximální počet opakování nesmí být záporný."
"Multiple statements are not supported.": "Více příkazů není podporováno."
"NewLife Presto Driver": "Ovladač NewLife Presto"
"Port must be between 1 and 65535.": "Port musí být v rozsahu 1 až 65535."
"Pure C# Presto/Trino ADO.NET driver with zero third-party dependencies, HTTP REST v1 protocol, full async/await and XCode ORM integration. MIT license. Supports net45~net11.": "Čistý ovladač ADO.NET pro Presto/Trino v C# bez závislostí třetích stran: protokol HTTP REST v1, plná podpora async/await a integrace s XCode ORM. Licence MIT. Podporuje net45~net11."
"Query failed: {0}": "Dotaz selhal: {0}"
"Retry interval cannot be negative.": "Interval opakování nesmí být záporný."
"Statement submission failed with HTTP {0}.": "Odeslání příkazu selhalo: HTTP {0}."
"The driver does not support auto-increment columns; use a business key (Guid/snowflake) or set AllowInsertIdentity.": "Ovladač nepodporuje sloupce s automatickým přírůstkem; použijte obchodní klíč (Guid/sněhová vločka) nebo nastavte AllowInsertIdentity."
"The driver does not support transactions.": "Ovladač nepodporuje transakce."
"Unsupported authentication mode: {0}.": "Nepodporovaný režim ověřování: {0}."
"Unsupported protocol: {0}. Use Presto or Trino.": "Nepodporovaný protokol: {0}. Použijte Presto nebo Trino."

"The server returned an empty response.": "Server vrátil prázdnou odpověď."
"Request to '{0}' failed with HTTP {1}.": "Požadavek na '{0}' selhal s HTTP {1}."
"Schema collection name cannot be empty.": "Název kolekce schémat nesmí být prázdný."

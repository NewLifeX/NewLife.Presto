# תרגום עברית. המפתחות הם טקסט המקור באנגלית; תרגומים חסרים חוזרים לאנגלית בזמן ריצה.
"AccessToken is required when Auth=JWT.": "אימות JWT דורש AccessToken."
"Command timeout cannot be negative.": "זמן הקצוב של הפקודה אינו יכול להיות שלילי."
"Command type {0} is not supported; use CommandType.Text.": "סוג הפקודה {0} אינו נתמך; השתמש ב-CommandType.Text."
"Connection timeout must be greater than zero.": "זמן הקצוב של החיבור חייב להיות גדול מאפס."
"Custom header '{0}' is managed by the driver and cannot be overridden.": "הכותרת המותאמת '{0}' מנוהלת על ידי מנהל ההתקן ולא ניתן לעקוף אותה."
"Host cannot be empty.": "המארח אינו יכול להיות ריק."
"Invalid custom header format: {0}. Expected name:value.": "תבנית כותרת מותאמת אינה חוקית: {0}. יש להשתמש בתבנית name:value."
"Invalid session property format: {0}. Expected key=value.": "תבנית מאפיין הפעלה אינה חוקית: {0}. יש להשתמש בתבנית key:value."
"Max retries cannot be negative.": "מספר הניסיונות החוזרים המרבי אינו יכול להיות שלילי."
"Multiple statements are not supported.": "מספר פקודות מרובות אינו נתמך."
"NewLife Presto Driver": "מנהל התקן NewLife Presto"
"Port must be between 1 and 65535.": "היציאה חייבת להיות בין 1 ל-65535."
"Pure C# Presto/Trino ADO.NET driver with zero third-party dependencies, HTTP REST v1 protocol, full async/await and XCode ORM integration. MIT license. Supports net45~net11.": "מנהל התקן ADO.NET טהור ב-C# עבור Presto/Trino ללא תלויות צד שלישי: פרוטוקול HTTP REST v1, async/await מלא ואינטגרציה עם XCode ORM. רישיון MIT. תומך ב-net45~net11."
"Query failed: {0}": "השאילתה נכשלה: {0}"
"Retry interval cannot be negative.": "מרווח הניסיונות החוזרים אינו יכול להיות שלילי."
"Statement submission failed with HTTP {0}.": "שליחת הפקודה נכשלה: HTTP {0}."
"The driver does not support auto-increment columns; use a business key (Guid/snowflake) or set AllowInsertIdentity.": "מנהל ההתקן אינו תומך בעמודות הגדלה אוטומטית; השתמש במפתח עסקי (Guid/פתית שלג) או הגדר AllowInsertIdentity."
"The driver does not support transactions.": "מנהל ההתקן אינו תומך בטרנזקציות."
"Unsupported authentication mode: {0}.": "מצב אימות שאינו נתמך: {0}."
"Unsupported protocol: {0}. Use Presto or Trino.": "פרוטוקול שאינו נתמך: {0}. השתמש ב-Presto או Trino."

# Magyar fordítás. A kulcsok az angol forrásszöveg; a hiányzó fordítások futásidőben angolra esnek vissza.
"AccessToken is required when Auth=JWT.": "A JWT-hitelesítéshez AccessToken szükséges."
"Command timeout cannot be negative.": "A parancs időtúllépése nem lehet negatív."
"Command type {0} is not supported; use CommandType.Text.": "A(z) {0} parancstípus nem támogatott; használjon CommandType.Text értéket."
"Connection timeout must be greater than zero.": "A kapcsolati időtúllépésnek nullánál nagyobbnak kell lennie."
"Custom header '{0}' is managed by the driver and cannot be overridden.": "A(z) «{0}» egyéni fejlécet az illesztőprogram kezeli, ezért nem írható felül."
"Host cannot be empty.": "A gazdagép nem lehet üres."
"Invalid custom header format: {0}. Expected name:value.": "Érvénytelen egyéni fejlécformátum: {0}. Elvárt formátum: name:value."
"Invalid session property format: {0}. Expected key=value.": "Érvénytelen munkamenet-tulajdonság formátum: {0}. Elvárt formátum: key=value."
"Max retries cannot be negative.": "Az újrapróbálkozások maximális száma nem lehet negatív."
"Multiple statements are not supported.": "Több utasítás nem támogatott."
"NewLife Presto Driver": "NewLife Presto illesztőprogram"
"Port must be between 1 and 65535.": "A portnak 1 és 65535 között kell lennie."
"Pure C# Presto/Trino ADO.NET driver with zero third-party dependencies, HTTP REST v1 protocol, full async/await and XCode ORM integration. MIT license. Supports net45~net11.": "Tiszta C# Presto/Trino ADO.NET illesztőprogram harmadik féltől származó függőségek nélkül: HTTP REST v1 protokoll, teljes async/await és XCode ORM integráció. MIT licenc. net45~net11 támogatás."
"Query failed: {0}": "A lekérdezés sikertelen: {0}"
"Retry interval cannot be negative.": "Az újrapróbálkozási időköz nem lehet negatív."
"Statement submission failed with HTTP {0}.": "Az utasítás elküldése sikertelen: HTTP {0}."
"The driver does not support auto-increment columns; use a business key (Guid/snowflake) or set AllowInsertIdentity.": "Az illesztőprogram nem támogatja az automatikusan növekvő oszlopokat; használjon üzleti kulcsot (Guid/hópehely) vagy állítsa be az AllowInsertIdentity értéket."
"The driver does not support transactions.": "Az illesztőprogram nem támogatja a tranzakciókat."
"Unsupported authentication mode: {0}.": "Nem támogatott hitelesítési mód: {0}."
"Unsupported protocol: {0}. Use Presto or Trino.": "Nem támogatott protokoll: {0}. Használjon Presto vagy Trino protokollt."

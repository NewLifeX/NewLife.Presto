"Connection timeout of {0} seconds expired.": "A(z) {0} másodperces kapcsolati időtúllépés lejárt."
"Command timeout of {0} seconds expired.": "A(z) {0} másodperces parancs-időtúllépés lejárt."
"Command behavior {0} is not supported.": "A(z) {0} parancsviselkedés nem támogatott."
"Parameter must be of type PrestoParameter.": "A paraméternek PrestoParameter típusúnak kell lennie."

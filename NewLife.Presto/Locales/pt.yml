# Tradução para português. As chaves são o texto de origem em inglês; traduções ausentes retornam ao inglês em tempo de execução.
"AccessToken is required when Auth=JWT.": "AccessToken é obrigatório para autenticação JWT."
"Command timeout cannot be negative.": "O tempo limite do comando não pode ser negativo."
"Command type {0} is not supported; use CommandType.Text.": "O tipo de comando {0} não é suportado; use CommandType.Text."
"Connection timeout must be greater than zero.": "O tempo limite de conexão deve ser maior que zero."
"Custom header '{0}' is managed by the driver and cannot be overridden.": "O cabeçalho personalizado «{0}» é gerenciado pelo driver e não pode ser substituído."
"Host cannot be empty.": "O host não pode estar vazio."
"Invalid custom header format: {0}. Expected name:value.": "Formato de cabeçalho personalizado inválido: {0}. Esperado name:value."
"Invalid session property format: {0}. Expected key=value.": "Formato de propriedade de sessão inválido: {0}. Esperado key=value."
"Max retries cannot be negative.": "O número máximo de tentativas não pode ser negativo."
"Multiple statements are not supported.": "Várias instruções não são suportadas."
"NewLife Presto Driver": "Driver NewLife Presto"
"Port must be between 1 and 65535.": "A porta deve estar entre 1 e 65535."
"Pure C# Presto/Trino ADO.NET driver with zero third-party dependencies, HTTP REST v1 protocol, full async/await and XCode ORM integration. MIT license. Supports net45~net11.": "Driver ADO.NET Presto/Trino em C# puro, sem dependências de terceiros: protocolo HTTP REST v1, async/await completo e integração com XCode ORM. Licença MIT. Suporta net45~net11."
"Query failed: {0}": "Falha na consulta: {0}"
"Retry interval cannot be negative.": "O intervalo de nova tentativa não pode ser negativo."
"Statement submission failed with HTTP {0}.": "Falha ao enviar a instrução: HTTP {0}."
"The driver does not support auto-increment columns; use a business key (Guid/snowflake) or set AllowInsertIdentity.": "O driver não suporta colunas de incremento automático; use uma chave de negócio (Guid/floco de neve) ou defina AllowInsertIdentity."
"The driver does not support transactions.": "O driver não suporta transações."
"Unsupported authentication mode: {0}.": "Modo de autenticação não suportado: {0}."
"Unsupported protocol: {0}. Use Presto or Trino.": "Protocolo não suportado: {0}. Use Presto ou Trino."

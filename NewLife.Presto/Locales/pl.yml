"Command timeout of {0} seconds expired.": "Limit czasu polecenia {0} sekund wygasł."
"Command behavior {0} is not supported.": "Zachowanie polecenia {0} nie jest obsługiwane."
"Parameter must be of type PrestoParameter.": "Parametr musi być typu PrestoParameter."

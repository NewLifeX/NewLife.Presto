"Catalog is required for the '{0}' schema collection.": "Kolekcja schematów '{0}' wymaga katalogu."
"Parameter '{0}' was not found.": "Nie znaleziono parametru '{0}'."
"Parameter name cannot be empty.": "Nazwa parametru nie może być pusta."
"Only input parameters are supported.": "Obsługiwane są tylko parametry wejściowe."

"The connection is not open.": "Połączenie nie jest otwarte."
"CommandText must not be empty.": "CommandText nie może być pusty."
"The connection string cannot be changed while the connection is open.": "Nie można zmienić ciągu połączenia, gdy połączenie jest otwarte."

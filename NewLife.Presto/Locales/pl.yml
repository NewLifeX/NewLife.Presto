# Tłumaczenie polskie. Klucze to angielski tekst źródłowy; brakujące tłumaczenia wracają do angielskiego w czasie działania.
"AccessToken is required when Auth=JWT.": "Uwierzytelnianie JWT wymaga elementu AccessToken."
"Command timeout cannot be negative.": "Limit czasu polecenia nie może być ujemny."
"Command type {0} is not supported; use CommandType.Text.": "Typ polecenia {0} nie jest obsługiwany; użyj CommandType.Text."
"Connection timeout must be greater than zero.": "Limit czasu połączenia musi być większy od zera."
"Custom header '{0}' is managed by the driver and cannot be overridden.": "Niestandardowy nagłówek «{0}» jest zarządzany przez sterownik i nie można go zastąpić."
"Host cannot be empty.": "Host nie może być pusty."
"Invalid custom header format: {0}. Expected name:value.": "Nieprawidłowy format niestandardowego nagłówka: {0}. Oczekiwano name:value."
"Invalid session property format: {0}. Expected key=value.": "Nieprawidłowy format właściwości sesji: {0}. Oczekiwano key=value."
"Max retries cannot be negative.": "Maksymalna liczba ponowień nie może być ujemna."
"Multiple statements are not supported.": "Wiele instrukcji nie jest obsługiwanych."
"NewLife Presto Driver": "Sterownik NewLife Presto"
"Port must be between 1 and 65535.": "Port musi należeć do zakresu od 1 do 65535."
"Pure C# Presto/Trino ADO.NET driver with zero third-party dependencies, HTTP REST v1 protocol, full async/await and XCode ORM integration. MIT license. Supports net45~net11.": "Czysty sterownik ADO.NET Presto/Trino w C# bez zależności innych firm: protokół HTTP REST v1, pełna obsługa async/await i integracja z XCode ORM. Licencja MIT. Obsługa net45~net11."
"Query failed: {0}": "Zapytanie nie powiodło się: {0}"
"Retry interval cannot be negative.": "Interwał ponowień nie może być ujemny."
"Statement submission failed with HTTP {0}.": "Wysłanie instrukcji nie powiodło się: HTTP {0}."
"The driver does not support auto-increment columns; use a business key (Guid/snowflake) or set AllowInsertIdentity.": "Sterownik nie obsługuje kolumn automatycznie zwiększanych; użyj klucza biznesowego (Guid/płatek śniegu) lub ustaw AllowInsertIdentity."
"The driver does not support transactions.": "Sterownik nie obsługuje transakcji."
"Unsupported authentication mode: {0}.": "Nieobsługiwany tryb uwierzytelniania: {0}."
"Unsupported protocol: {0}. Use Presto or Trino.": "Nieobsługiwany protokół: {0}. Użyj Presto lub Trino."

"NewLife Presto EF6 Provider": "新生命Presto EF6提供程序"
"Entity Framework 6 provider for Presto/Trino built on NewLife.Presto. Read-only queries; writes, transactions and migrations are not supported.": "基于 NewLife.Presto 的 Presto/Trino Entity Framework 6 提供程序，仅支持只读查询；不支持写入、事务与迁移。"
"Stored procedures and table-valued functions are not supported by the Presto provider.": "Presto 提供程序不支持存储过程与表值函数。"
"The provider does not support database creation or deletion.": "该提供程序不支持建库或删库。"
"The provider does not support SaveChanges. Presto/Trino is read-only in this driver.": "该提供程序不支持 SaveChanges。本驱动中的 Presto/Trino 为只读。"
"TimeSpan literals are not supported by the Presto provider.": "Presto 提供程序不支持 TimeSpan 字面量。"
